name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11, which supports trusted publishing.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish unless the version already exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@george2f/eslint-plugin-clean-code@$VERSION" version >/dev/null 2>&1; then
            echo "v$VERSION is already published; skipping"
          else
            npm publish --access public --provenance
          fi
