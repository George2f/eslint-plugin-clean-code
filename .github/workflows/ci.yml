name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:dist
      - run: npm pack --dry-run
      - run: npx --yes publint

  eslint-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['8.57.1', '9', '10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: node -p "require('eslint/package.json').version"
      - run: npm test
